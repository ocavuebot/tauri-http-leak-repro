[package]
name = "http-leak-repro"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = "=2.7.3"

[dependencies]
# Same versions and features as reflect-open.
tauri = { version = "=2.12.4", features = ["custom-protocol"] }
tauri-plugin-http = { version = "=2.8.3", features = ["unsafe-headers"] }
serde_json = "1"

[profile.release]
debug = false
